name: pipeline smoke test
on:
  push:
    branches: [main, pipeline-rebuild]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-3.9.2
    steps:
      - uses: actions/checkout@v4
      - name: install uv + curl
        run: |
          apt-get update && apt-get install -y curl ca-certificates
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: run smoke test (public data, one-tile AOI)
        run: bash pipeline/smoke_test.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate Dockerfile builds
        run: docker build -t nv-sagegrouse .

  # Unit tests run entirely on synthetic data generated in tmp_path. They never
  # read data-local/, which does not exist in CI -- the guard step below enforces
  # that rather than trusting it.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: install MuMIn
        run: Rscript -e 'install.packages("MuMIn", repos = "https://cloud.r-project.org")'
      - name: python unit tests
        run: |
          uv run --with pytest --with numpy --with pandas --with rasterio --with scipy \
            --with geopandas --with pyarrow --with pyogrio pytest tests/ -v
      - name: R model tests
        run: Rscript tests/test_r_models.R
      - name: guard -- no test may reference real lek data
        run: |
          if grep -rnE 'leks_all\.csv|data-local/(leks|design)' tests/ \
               --include='*.py' --include='*.R' | grep -v 'dest_root'; then
            echo "FAIL: a test references real lek data outside a synthetic tmp_path skeleton."
            exit 1
          fi
          echo "OK: no sensitive inputs referenced by tests/"

  # Verifies every numeric claim in reports/*.qmd against reports/v4/*.csv.
  # Those CSVs are committed (aggregate statistics only -- no coordinates), so
  # any drift between the manuscript and the analysis is a hard build failure.
  report-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: verify report numbers against artifacts
        run: uv run tests/check_consistency.py --quiet-warnings
